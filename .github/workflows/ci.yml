name: CI
on: [push, pull_request]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @catalog/shared test
      - run: pnpm --filter @catalog/web test

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @catalog/api test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @catalog/web build

  storybook:
    runs-on: ubuntu-latest
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: every story renders, runs its play (interaction) test and passes axe
        run: pnpm --filter @catalog/web test:stories
      - name: storybook builds
        run: pnpm --filter @catalog/web build-storybook

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t (syntax and directives of the edge proxy)
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: docker compose up --build (the only manual step is the cp above)
        run: docker compose up --build -d --wait
      - name: smoke + protection checks through nginx (headers, methods, limits, per-address rate limiting)
        run: scripts/smoke.sh
      - name: hostile client - spam from many real addresses, lockout, cross-user reads, enumeration, CSRF
        run: scripts/attack-login.sh
      - if: failure()
        run: docker compose logs

  # One parallel job per browser, each with its own freshly started stack (own database): nothing shared.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BULK_CHUNK_DELAY_MS: '150' # slow enough for the cancel-mid-way scenario
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: start the stack (nginx -> web + api -> PostgreSQL)
        run: docker compose up --build -d --wait
      - name: playwright version
        id: pw
        run: echo "v=$(pnpm --filter @catalog/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: cache ${{ matrix.browser }} binary
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ matrix.browser }}-${{ steps.pw.outputs.v }}
      - name: install ${{ matrix.browser }}
        timeout-minutes: 10 # a stalled download fails fast instead of hanging the job
        run: pnpm --filter @catalog/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: e2e
        run: pnpm --filter @catalog/web exec playwright test --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs --tail=200
