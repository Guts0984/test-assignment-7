name: CI
on: [push, pull_request]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @catalog/shared test
      - run: pnpm --filter @catalog/web test

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @catalog/api test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @catalog/web build

  storybook:
    runs-on: ubuntu-latest
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: every story renders, runs its play (interaction) test and passes axe
        run: pnpm --filter @catalog/web test:stories
      - name: storybook builds
        run: pnpm --filter @catalog/web build-storybook

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t (syntax and directives of the edge proxy)
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: docker compose up --build (the only manual step is the cp above)
        run: docker compose up --build -d --wait
      - name: smoke + protection checks through nginx (headers, methods, limits, per-address rate limiting)
        run: scripts/smoke.sh
      - name: hostile client - spam from many real addresses, lockout, cross-user reads, enumeration, CSRF
        run: scripts/attack-login.sh
      - if: failure()
        run: docker compose logs

  # One parallel job per browser, each with its own freshly started stack (own database): nothing shared.
  e2e:
    name: e2e (${{ matrix.browser }})
    # Pinned: `ubuntu-latest` moved to a new release whose apt mirrors the runner could not resolve, so
    # `playwright install --with-deps` (which apt-installs system libraries) failed or hung.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BULK_CHUNK_DELAY_MS: '150' # slow enough for the cancel-mid-way scenario
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: start the stack (nginx -> web + api -> PostgreSQL)
        run: docker compose up --build -d --wait
      # The browsers come from Microsoft's Playwright image (pulled from mcr.microsoft.com, browsers already
      # inside), NOT from `playwright install --with-deps`, which apt-installs libraries from the Ubuntu
      # mirrors - unreachable from the runner at times, which hung or failed the job. Host network: the
      # container reaches the compose stack on localhost:8080 exactly like a browser on the runner would.
      - name: e2e (${{ matrix.browser }}) in the Playwright image
        run: |
          VER="$(pnpm --filter @catalog/web exec playwright --version | awk '{print $2}')"
          docker run --rm --network host --ipc=host -e CI=true \
            -v "$PWD:/work" -w /work/apps/web \
            "mcr.microsoft.com/playwright:v${VER}-noble" \
            ./node_modules/.bin/playwright test --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs --tail=200
