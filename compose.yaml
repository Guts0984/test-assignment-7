# docker compose up --build   (after: cp .env.example .env)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true # PID 1 reaps zombies and forwards signals
    env_file: .env
    environment:
      # in-network address; everything else comes from .env
      DATABASE_URL: postgres://${POSTGRES_USER:-catalog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-catalog}
      API_PORT: 4000
      # the browser's origin is the nginx entry point
      CORS_ORIGIN: http://localhost:${PUBLIC_PORT:-8080}
      # exactly one trusted proxy (nginx): the per-user rate limiter reads the real client address from it
      TRUST_PROXY_HOPS: 1
      # 0 in production; e2e raises it so a bulk job is slow enough to be cancelled mid-way
      BULK_CHUNK_DELAY_MS: ${BULK_CHUNK_DELAY_MS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    # not published: reachable only through nginx
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/ready']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        SHOW_DEMO_LOGINS: ${SHOW_DEMO_LOGINS:-true}
        SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-pass-123}
        SEED_EDITOR1_PASSWORD: ${SEED_EDITOR1_PASSWORD:-editor1-pass-123}
        SEED_EDITOR2_PASSWORD: ${SEED_EDITOR2_PASSWORD:-editor2-pass-123}
        SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:-viewer-pass-123}
    init: true
    depends_on:
      api:
        condition: service_healthy
    # not published: reachable only through nginx
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/uk/login']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # The only published entry point: http://localhost:8080 serves the web app (/) and the API (/api, /docs).
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PUBLIC_PORT:-8080}:8080'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/nginx-health']
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
