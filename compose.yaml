# docker compose up --build   (after: cp .env.example .env)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true # PID 1 reaps zombies and forwards signals
    env_file: .env
    environment:
      # in-network address; everything else comes from .env
      DATABASE_URL: postgres://${POSTGRES_USER:-catalog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-catalog}
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/ready']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/uk/login']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
