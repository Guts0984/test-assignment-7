# Edge proxy: the only published entry point (port 8080) for both the web app and the API.
#
# Client identity: nginx is the first hop, so $remote_addr IS the user's address. It is passed to the
# API as X-Forwarded-For with `$remote_addr` only - a value the client sent is DISCARDED, never appended -
# and the API runs with TRUST_PROXY_HOPS=1, so its per-user rate limiter keys on the real address,
# not on this proxy's address (which would put every user into one shared bucket).
# Behind another load balancer, add `set_real_ip_from <lb-cidr>; real_ip_header X-Forwarded-For;` here.

# TLS: this demo listens on plain HTTP (localhost). For anything else terminate TLS here (or in the load
# balancer in front): `listen 8443 ssl;` + ssl_certificate/ssl_certificate_key, redirect :80 -> https, add
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# and run the API with COOKIE_SECURE=true so the session cookie is never sent in clear text.

server_tokens off;

# ---- abuse limits, per client address ------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=site:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

upstream api_up {
    server api:4000;
    keepalive 16;
}

upstream web_up {
    server web:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # ---- slow-client / oversize protection ---------------------------------------------------
    client_max_body_size 1m;          # the API accepts at most 1 MB as well
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_conn perip 40;

    # ---- headers on every response -----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    proxy_hide_header X-Powered-By;

    # The app uses GET/HEAD/POST/PATCH only.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH)$) {
        return 405;
    }

    gzip on;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 1024;

    # Defaults for every proxied location.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;   # keeps the :8080 port, so absolute links built from Host are right
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;       # replaces whatever the client sent
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Login: strict coarse limit here, exact accounting in the API.
    # Express routes case-insensitively and ignores a trailing slash, so this must too (a plain
    # `location = /api/auth/login` is bypassed by /api/auth/LOGIN and /api/auth/login/).
    location ~* ^/api/auth/login/*$ {
        limit_req zone=login burst=20 nodelay;
        rewrite ^ /auth/login break;
        proxy_pass http://api_up;
    }

    # API: the /api prefix is stripped.
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://api_up/;
    }

    # Swagger UI and its JSON.
    location ~ ^/(docs|docs-json)(/|$) {
        limit_req zone=site burst=50 nodelay;
        proxy_pass http://api_up;
    }

    # Everything else is the Next.js app.
    location / {
        limit_req zone=site burst=200 nodelay;
        proxy_pass http://web_up;
    }
}
